services:
  cluster:
    command: ["python", "-m", "camoufox_connector.server"]
    entrypoint: ["/app/scripts/docker-entrypoint-override.sh"]
    environment:
      - CAMOUFOX_DEBUG=${CAMOUFOX_DEBUG:-false}
      - CAMOUFOX_MODE=${CAMOUFOX_MODE:-pool}
      - CAMOUFOX_POOL_SIZE=${CAMOUFOX_POOL_SIZE:-3}
      - CAMOUFOX_PROXY=${CAMOUFOX_PROXY:?}
      - TRAWL_MITM_CA_DIR=${TRAWL_MITM_CA_DIR:?}
      - TRAWL_MITM_CA_URL=${TRAWL_ORIGIN:?}/proxy-ca.crt
      - NODE_USE_SYSTEM_CA=1
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    image: ghcr.io/oyedejioyewole/browser-connector:edge
    restart: unless-stopped
    volumes:
      - ../scripts/browser-connector-cluster.sh:/app/scripts/docker-entrypoint-override.sh:ro

  gateway:
    environment:
      - NITRO_APP_SECRET=${NITRO_APP_SECRET:?}
      - NITRO_UPSTREAM_URL=${NITRO_UPSTREAM_URL:?}
    restart: unless-stopped
