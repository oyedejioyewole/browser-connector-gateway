services:
  browser-connector:
    container_name: browser-connector
    environment:
      - CAMOUFOX_API_HOST=::1
      - CAMOUFOX_DEBUG=${CAMOUFOX_DEBUG}
      - CAMOUFOX_GEOIP=false
      - CAMOUFOX_MODE=pool
      - CAMOUFOX_POOL_SIZE=3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: ghcr.io/oyedejioyewole/browser-connector:edge
    ports:
      - 3000:3000
      - 8080:8080
    restart: unless-stopped

  browser-connector-gateway:
    container_name: browser-connector-gateway
    depends_on:
      browser-connector:
        condition: service_healthy
    environment:
      - NITRO_APP_SECRET=${NITRO_APP_SECRET}
      - NITRO_UPSTREAM_URL=http://[::1]:8080
    image: ghcr.io/oyedejioyewole/browser-connector-gateway:latest
    # Bind this service's network stack to the network stack of browser-connector
    network_mode: service:browser-connector
    restart: unless-stopped
    volumes:
      - browser-connector-gateway:/app/.data

volumes:
  browser-connector-gateway:
    name: browser-connector-gateway-data

networks:
  default:
    name: browser-connector
